<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aquarium Shop Tycoon · Prototype v0.1</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#eafcff;background:#07151c}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#07151c,#0b2730);min-height:100vh}.app{max-width:900px;margin:auto;padding:16px}.top{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill,.card{background:#102d36;border:1px solid #24515d;border-radius:14px;padding:10px 14px}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-top:12px}.shop{min-height:330px;position:relative;overflow:hidden}.tankrow{display:flex;gap:10px;margin-top:15px}.tank{flex:1;height:105px;border:3px solid #66d7ef;border-top-width:8px;border-radius:5px;background:linear-gradient(#1e7790 20%,#105268 80%);position:relative}.fish{position:absolute;font-size:22px;animation:swim 4s linear infinite}@keyframes swim{0%{left:5%}50%{left:75%}100%{left:5%}}.customer{font-size:42px;position:absolute;bottom:20px;left:12px;transition:.5s}.counter{position:absolute;right:20px;bottom:25px;background:#714b2c;padding:14px 22px;border-radius:5px}h1,h2,h3,p{margin-top:0}button{width:100%;padding:11px;margin:5px 0;border:0;border-radius:10px;background:#19a9c4;color:white;font-weight:700;cursor:pointer}button.secondary{background:#315661}button:disabled{opacity:.45;cursor:not-allowed}.stockline{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #214650}.log{height:145px;overflow:auto;font-size:13px}.good{color:#67e6a5}.warn{color:#ffd166}.small{font-size:12px;opacity:.75}@media(max-width:700px){.grid{grid-template-columns:1fr}.shop{min-height:300px}}
</style>
</head>
<body><div class="app">
<div class="top"><div><h1>🐠 Aquarium Shop Tycoon</h1><div class="small">Prototipo funcional v0.1 · economía provisional</div></div><div class="stats"><div class="pill">🪙 <b id="money">500</b></div><div class="pill">⭐ Nivel <b id="level">1</b></div><div class="pill">👥 <b id="served">0</b> ventas</div></div></div>
<div class="grid">
<section class="card shop"><h2 id="shopName">Mi Tienda Acuática</h2><p>Los clientes compran automáticamente según el stock disponible.</p><div class="tankrow"><div class="tank"><span class="fish" style="top:30px">🐟</span></div><div class="tank"><span class="fish" style="top:55px;animation-delay:-2s">🐠</span></div><div class="tank" id="tank3" style="display:none"><span class="fish" style="top:38px">🐡</span></div></div><div id="customer" class="customer">🚶</div><div class="counter">🧑‍💼 Caja</div></section>
<section class="card"><h2>📦 Stock</h2><div id="stock"></div><p class="small">Almacén: <b id="used">0</b>/<b id="capacity">20</b> volumen</p><h3>🚚 Proveedor</h3><button onclick="order('betta',5)">5 Bettas · 125 🪙</button><button onclick="order('comet',5)">5 Cometas · 75 🪙</button><button onclick="order('food',5)">5 Comidas · 100 🪙</button><div id="delivery" class="small"></div></section>
<section class="card"><h2>🔨 Mejoras</h2><button id="shelfBtn" onclick="upgradeShelf()">Estantería · 250 🪙</button><button id="tankBtn" onclick="upgradeTank()" disabled>Tercer acuario · 350 🪙</button><button id="warehouseBtn" onclick="upgradeWarehouse()" disabled>Almacén I · 4.000 🪙</button><button class="secondary" onclick="saveGame()">💾 Guardar partida</button><button class="secondary" onclick="resetGame()">Reiniciar prototipo</button></section>
<section class="card"><h2>📋 Actividad</h2><div id="log" class="log"></div></section>
</div></div>
<script>
const products={betta:{name:'Betta',buy:25,sell:45,vol:0},comet:{name:'Cometa',buy:15,sell:30,vol:0},food:{name:'Comida básica',buy:20,sell:35,vol:1}};
let state={money:500,level:1,served:0,capacity:20,stock:{betta:5,comet:6,food:5},shelf:false,tank3:false,warehouse:false,lastSeen:Date.now(),delivery:null};
const $=id=>document.getElementById(id);const fmt=n=>Math.floor(n).toLocaleString('es-ES');
function used(){return Object.entries(state.stock).reduce((a,[k,v])=>a+v*products[k].vol,0)}
function log(t,c=''){let d=document.createElement('div');d.className=c;d.textContent='• '+t;$('log').prepend(d)}
function render(){ $('money').textContent=fmt(state.money);$('level').textContent=state.level;$('served').textContent=state.served;$('capacity').textContent=state.capacity;$('used').textContent=used();$('stock').innerHTML=Object.entries(products).map(([k,p])=>`<div class="stockline"><span>${p.name}</span><b>${state.stock[k]||0}</b></div>`).join('');$('shelfBtn').disabled=state.shelf;$('tankBtn').disabled=!state.shelf||state.tank3;$('warehouseBtn').disabled=state.level<8||state.warehouse;$('tank3').style.display=state.tank3?'block':'none';}
function recalcLevel(){let s=state.served;state.level=Math.min(10,1+(s>=5)+(s>=10)+(s>=18)+(s>=28)+(s>=40)+(s>=55)+(s>=75)+(s>=100)+(s>=130));}
function customer(){let keys=Object.keys(products).filter(k=>(state.stock[k]||0)>0);if(!keys.length){log('Cliente se fue: no había stock','warn');return}let k=keys[Math.floor(Math.random()*keys.length)],p=products[k];state.stock[k]--;state.money+=p.sell;state.served++;$('customer').style.left=(20+Math.random()*55)+'%';log(`Venta: ${p.name} +${p.sell} 🪙`,'good');recalcLevel();render();saveGame(false)}
function order(k,q){if(state.delivery){log('Ya hay una entrega en camino','warn');return}let p=products[k],cost=p.buy*q;if(state.money<cost){log('No tienes suficiente dinero','warn');return}if(used()+p.vol*q>state.capacity){log('No cabe en el almacén','warn');return}state.money-=cost;state.delivery={k,q,end:Date.now()+30000};log(`Pedido realizado: ${q} ${p.name}. Entrega 30 s`);render()}
function deliveryTick(){if(!state.delivery){$('delivery').textContent='';return}let left=Math.max(0,state.delivery.end-Date.now());$('delivery').textContent='Entrega en '+Math.ceil(left/1000)+' s';if(left<=0){let d=state.delivery;state.stock[d.k]=(state.stock[d.k]||0)+d.q;log(`Pedido recibido: ${d.q} ${products[d.k].name}`,'good');state.delivery=null;render()}}
function upgradeShelf(){if(state.money<250)return log('Faltan monedas','warn');state.money-=250;state.shelf=true;log('¡Primera estantería instalada!','good');render()}
function upgradeTank(){if(state.money<350)return log('Faltan monedas','warn');state.money-=350;state.tank3=true;log('¡Tercer acuario construido!','good');render()}
function upgradeWarehouse(){if(state.money<4000)return log('Faltan monedas','warn');state.money-=4000;state.capacity=50;state.warehouse=true;log('¡Almacén ampliado a 50!','good');render()}
function saveGame(show=true){state.lastSeen=Date.now();localStorage.setItem('aquariumShopV01',JSON.stringify(state));if(show)log('Partida guardada','good')}
function load(){let raw=localStorage.getItem('aquariumShopV01');if(!raw)return;try{let old=JSON.parse(raw),hours=Math.min(4,(Date.now()-(old.lastSeen||Date.now()))/3600000);state={...state,...old};if(hours>.02){let bonus=Math.floor(hours*250*.7);state.money+=bonus;log(`Mientras estabas fuera: +${bonus} 🪙 (${hours.toFixed(1)} h)`,'good')}}catch(e){}}
function resetGame(){if(confirm('¿Reiniciar el prototipo?')){localStorage.removeItem('aquariumShopV01');location.reload()}}
load();render();log('Tienda abierta. Primer objetivo: vender y reinvertir.');setInterval(customer,8000);setInterval(deliveryTick,250);setInterval(()=>saveGame(false),5000);
</script></body></html>
